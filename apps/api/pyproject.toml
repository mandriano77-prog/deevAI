[project]
name = "deevai-api"
version = "0.1.0"
description = "deevAI backend — multi-tenant FastAPI for Google DV360 bid optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "cryptography>=43",          # Fernet for the dev secrets vault stub
    "boto3>=1.35",
    "requests>=2.32",
    "httpx>=0.27",
    "anthropic>=0.30",
    "resend>=2.0",
    # bidagent: install via requirements.txt / render.yaml / CI (monorepo path).
]

# uv: optional local path override when you `uv add` bidagent manually.
[tool.uv.sources]
bidagent = { path = "../../packages/bidagent", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deevai_api*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
