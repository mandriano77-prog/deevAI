[project]
name = "bidagent"
version = "0.1.0"
description = "DeevAI decision engine and DSP adapters (DV360-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "anthropic>=0.30",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {bidagent = "."}
packages = [
    "bidagent",
    "bidagent.providers",
    "bidagent.providers.dv360",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
