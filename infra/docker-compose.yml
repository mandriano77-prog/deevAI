# Local dev infrastructure for deevAI.
# Just Postgres for now — Redis/Celery/worker arrive when we add the scheduler.

services:
  postgres:
    image: postgres:16-alpine
    container_name: deevai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deevai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deevai-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-deevai}
    ports:
      - "5432:5432"
    volumes:
      - deevai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deevai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  deevai_postgres_data:
